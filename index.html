<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q0 - Smart Campus Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-body); color: var(--text-main); padding-bottom: 80px; }

        .app-header {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 100;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand { font-size: 1.1rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        .brand span { background: var(--accent); color: white; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; }

        .role-selector {
            background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main);
            padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; outline: none;
        }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); padding: 12px; border-radius: 12px; text-align: center; }
        .stat-val { font-size: 1.3rem; font-weight: 700; color: var(--text-main); }
        .stat-lbl { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }

        .tab-group { display: flex; background: var(--bg-card); border-radius: 10px; padding: 4px; border: 1px solid var(--border); margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); font-weight: 600; font-size: 0.85rem; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background: var(--accent); color: white; }

        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .card-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 16px; }

        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
        input, select, textarea {
            width: 100%; background: var(--bg-input); border: 1px solid var(--border);
            color: var(--text-main); padding: 12px; border-radius: 8px; font-size: 0.9rem; outline: none;
        }

        .btn {
            width: 100%; background: var(--accent); color: white; border: none;
            padding: 12px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer;
        }
        .btn-sm { width: auto; padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }

        .feed-item {
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border);
            border-radius: 12px; padding: 14px; margin-bottom: 12px;
        }
        .feed-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .feed-title { font-weight: 600; font-size: 0.95rem; }
        .feed-sub { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }

        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
        .badge.PENDING, .badge.OPEN { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid var(--warning); }
        .badge.APPROVED, .badge.RESOLVED { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); }
        .badge.REJECTED { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); }

        .img-preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin: 10px 0; border: 1px solid var(--border); }
        .action-btns { display: flex; gap: 8px; margin-top: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand">Q0 <span>Smart Campus</span></div>
        <div>
            <select id="roleSelector" class="role-selector" onchange="changeRole()">
                <option value="student">🎓 Student View</option>
                <option value="faculty">👨‍🏫 Faculty View</option>
                <option value="maintenance">🛠️ Maintenance View</option>
            </select>
        </div>
    </header>

    <div class="container">

        <!-- Stats Bar -->
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-val" id="statPending">0</div><div class="stat-lbl">Pending Docs</div></div>
            <div class="stat-card"><div class="stat-val" id="statApproved">0</div><div class="stat-lbl">Approved</div></div>
            <div class="stat-card"><div class="stat-val" id="statIncidents">0</div><div class="stat-lbl">Open Issues</div></div>
        </div>

        <!-- ==================== 1. STUDENT VIEW ==================== -->
        <div id="studentPortal">
            <div class="tab-group">
                <button class="tab-btn active" onclick="switchStudentTab('subTab', this)">Submit Request</button>
                <button class="tab-btn" onclick="switchStudentTab('myDocsTab', this)">My Submissions</button>
            </div>

            <!-- Submit Forms -->
            <div id="subTab">
                <div class="card">
                    <div class="card-title">Document Approval Request</div>
                    <form id="docForm">
                        <div class="form-group">
                            <label>Your Email</label>
                            <input type="email" id="studentEmail" placeholder="student@campus.edu" required>
                        </div>
                        <div class="form-group">
                            <label>Approval Type</label>
                            <select id="docType">
                                <option value="On-Duty (OD)">On-Duty (OD) Letter</option>
                                <option value="Leave Request">Leave Request</option>
                                <option value="Lab Access">Special Lab Access</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Reason / Purpose</label>
                            <textarea id="docReason" rows="2" placeholder="Briefly state the reason..." required></textarea>
                        </div>
                        <button type="submit" class="btn">Submit Request</button>
                    </form>
                </div>

                <div class="card">
                    <div class="card-title">Report Infrastructure Incident</div>
                    <form id="incidentForm">
                        <div class="form-group">
                            <label>Campus Location</label>
                            <input type="text" id="incLocation" placeholder="e.g. Block C - Lab 3" required>
                        </div>
                        <div class="form-group">
                            <label>Issue Description</label>
                            <input type="text" id="incDesc" placeholder="e.g. Broken Fan / Light issue" required>
                        </div>
                        <div class="form-group">
                            <label>Attach Photo</label>
                            <input type="file" id="incPhoto" accept="image/*" required>
                        </div>
                        <button type="submit" class="btn">Report Incident</button>
                    </form>
                </div>
            </div>

            <!-- Student's Own Tracked Submissions -->
            <div id="myDocsTab" class="hidden">
                <div class="card">
                    <div class="card-title">My Document Statuses</div>
                    <div id="studentDocsFeed"></div>
                </div>
                <div class="card">
                    <div class="card-title">My Reported Incidents</div>
                    <div id="studentIncidentsFeed"></div>
                </div>
            </div>
        </div>

        <!-- ==================== 2. FACULTY VIEW ==================== -->
        <div id="facultyPortal" class="hidden">
            <div class="card">
                <div class="card-title">Faculty Review Queue</div>
                <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:12px;">Review student OD/Leave requests pending approval.</p>
                <div id="facultyApprovalsFeed"></div>
            </div>
        </div>

        <!-- ==================== 3. MAINTENANCE VIEW ==================== -->
        <div id="maintenancePortal" class="hidden">
            <div class="card">
                <div class="card-title">Helpdesk Maintenance Feed</div>
                <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:12px;">Reported campus issues requiring repair.</p>
                <div id="maintenanceFeed"></div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
    <script>
        function switchStudentTab(tabId, btn) {
            document.getElementById('subTab').classList.add('hidden');
            document.getElementById('myDocsTab').classList.add('hidden');
            document.querySelectorAll('#studentPortal .tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.remove('hidden');
            btn.classList.add('active');
        }
    </script>
</body>
</html>
